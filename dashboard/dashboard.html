<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAR Live Score Platform</title>
  <style>
    /* ── Reset y base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0e1a;
      color: #e8eaf6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    /* ── Header ───────────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #7986cb;
    }
    header p {
      font-size: 0.78rem;
      color: #546e7a;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* ── Tarjeta principal del partido ───────────────────── */
    .match-card {
      background: #131929;
      border: 1px solid #1e2a45;
      border-radius: 16px;
      padding: 40px 48px;
      width: 100%;
      max-width: 560px;
      text-align: center;
      position: relative;
      transition: border-color 0.4s;
    }
    .match-card.var-active {
      border-color: #f57c00;
      box-shadow: 0 0 24px rgba(245, 124, 0, 0.25);
    }

    /* ── Nombres de equipos ───────────────────────────────── */
    .teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }
    .team-name {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #90a4ae;
      flex: 1;
    }
    .team-name.home { text-align: left; }
    .team-name.away { text-align: right; }
    .vs { font-size: 0.75rem; color: #37474f; font-weight: 700; }

    /* ── Marcador ─────────────────────────────────────────── */
    .scoreboard {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin: 16px 0 24px;
    }
    .score {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      color: #e8eaf6;
      transition: transform 0.2s, color 0.3s;
      min-width: 72px;
    }
    .score.bump {
      transform: scale(1.25);
      color: #42a5f5;
    }
    .score.bump-down {
      transform: scale(1.15);
      color: #ef5350;
    }
    .score-divider {
      font-size: 3.5rem;
      font-weight: 100;
      color: #263238;
    }

    /* ── Banner VAR ───────────────────────────────────────── */
    .var-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(90deg, #e65100, #f57c00);
      border-radius: 8px;
      padding: 10px 20px;
      margin-bottom: 20px;
      animation: pulse 1.2s infinite;
    }
    .var-banner.visible { display: flex; }
    .var-banner span { font-size: 0.9rem; font-weight: 700; letter-spacing: 2px; color: #fff; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.7; }
    }

    /* ── Ultimo evento ────────────────────────────────────── */
    .last-event {
      font-size: 0.82rem;
      color: #546e7a;
      min-height: 20px;
      transition: color 0.3s;
    }
    .last-event.goal   { color: #42a5f5; }
    .last-event.annul  { color: #ef5350; }
    .last-event.var    { color: #f57c00; }

    /* ── Log de eventos ───────────────────────────────────── */
    .event-log {
      width: 100%;
      max-width: 560px;
      margin-top: 24px;
    }
    .event-log h2 {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #37474f;
      margin-bottom: 10px;
      padding-left: 4px;
    }
    .log-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }
    .log-list li {
      background: #131929;
      border: 1px solid #1e2a45;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .log-list .log-time { color: #37474f; font-family: monospace; font-size: 0.72rem; }
    .log-list .log-icon { font-size: 1rem; }
    .log-list .log-text { color: #90a4ae; }

    /* ── Boton Reiniciar Partido ─────────────────────────── */
    .btn-reiniciar {
      margin-top: 20px;
      padding: 10px 24px;
      background: #1e2a45;
      color: #90a4ae;
      border: 1px solid #37474f;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn-reiniciar:hover:not(:disabled) {
      background: #263238;
      color: #e8eaf6;
      border-color: #546e7a;
    }
    .btn-reiniciar:active:not(:disabled) {
      background: #37474f;
    }
    .btn-reiniciar:disabled {
      background: #0d1220;
      color: #37474f;
      border-color: #1e2a45;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .btn-hint {
      margin-top: 6px;
      font-size: 0.68rem;
      color: #37474f;
      letter-spacing: 0.5px;
    }

    /* ── Indicador de conexion ───────────────────────────── */
    .conn-status {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: #546e7a;
      background: #131929;
      border: 1px solid #1e2a45;
      border-radius: 20px;
      padding: 6px 12px;
    }
    .conn-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #37474f;
      transition: background 0.3s;
    }
    .conn-dot.live         { background: #66bb6a; box-shadow: 0 0 6px #66bb6a88; }
    .conn-dot.finished     { background: #ef5350; }
    .conn-dot.connecting,
    .conn-dot.restarting   { background: #f57c00; animation: pulse 1s infinite; }
    .conn-dot.disconnected { background: #546e7a; }
  </style>
</head>
<body>

  <!-- Indicador de conexion WebSocket -->
  <div class="conn-status">
    <div class="conn-dot connecting" id="connDot"></div>
    <span id="connLabel">Conectando...</span>
  </div>

  <header>
    <h1>📺 VAR Live Score</h1>
    <p>Sistemas Distribuidos · Arquitectura Kafka + RabbitMQ</p>
  </header>

  <!-- Tarjeta del partido -->
  <div class="match-card" id="matchCard">

    <!-- Banner VAR (visible solo durante VAR_CHECK) -->
    <div class="var-banner" id="varBanner">
      <span>📺 VAR EN REVISIÓN</span>
    </div>

    <!-- Nombres de equipos -->
    <div class="teams">
      <div class="team-name home">Local</div>
      <div class="vs">VS</div>
      <div class="team-name away">Visitante</div>
    </div>

    <!-- Marcador principal -->
    <div class="scoreboard">
      <div class="score" id="scoreHome">-</div>
      <div class="score-divider">:</div>
      <div class="score" id="scoreAway">-</div>
    </div>

    <!-- Ultimo evento recibido -->
    <div class="last-event" id="lastEvent">Esperando inicio del partido...</div>

  </div>

  <!-- Log de eventos en tiempo real -->
  <div class="event-log">
    <h2>⚡ Eventos en tiempo real</h2>
    <ul class="log-list" id="logList"></ul>
  </div>

  <!-- Boton de reinicio del partido -->
  <!-- disabled: el partido arranca solo al iniciar el contenedor, el botón
       solo debe habilitarse cuando el partido termine (MATCH_END) -->
  <button class="btn-reiniciar" id="btnReiniciar" onclick="reiniciarPartido()" disabled>
    🔄 Reiniciar Partido
  </button>
  <!-- Texto de ayuda que indica al usuario cuándo puede presionar el botón -->
  <p class="btn-hint" id="btnHint">Disponible cuando finalice el partido</p>

  <script>
    // =========================================================================
    // SCRIPT PRINCIPAL DEL DASHBOARD
    // =========================================================================
    // Este bloque de JavaScript es el cliente del sistema VAR Live Score.
    // Se comunica con el dashboard_backend a través de WebSocket para recibir
    // eventos del partido en tiempo real.
    //
    // Flujo de datos que llega hasta aquí:
    //   live_feed_producer → Kafka → match_state_service → RabbitMQ
    //   → dashboard_backend (WebSocket) → ESTE SCRIPT → pantalla del usuario
    //
    // Responsabilidades de este script:
    //   1. Mantener la conexión WebSocket con el dashboard_backend
    //   2. Actualizar el marcador, el log y los indicadores visuales
    //   3. Controlar el estado del botón "Reiniciar Partido"
    //   4. Enviar la señal de reinicio al backend cuando el usuario lo solicita
    // =========================================================================

    // ── Configuración de la conexión WebSocket ────────────────────────────────
    // Construimos la URL del WebSocket usando la misma dirección del servidor
    // que sirvió esta página HTML. Así funciona tanto en local (localhost:3003)
    // como en producción (cualquier dominio), sin hardcodear la URL.
    const WS_URL = `ws://${window.location.host}`;

    // ── Referencias a elementos del DOM ──────────────────────────────────────
    // Guardamos referencias a los elementos HTML que necesitamos actualizar
    // dinámicamente. Es más eficiente guardarlas aquí que buscarlas en el DOM
    // cada vez que necesitemos actualizarlas (getElementById es costoso en loops).
    const scoreHome    = document.getElementById('scoreHome');    // Número goles local
    const scoreAway    = document.getElementById('scoreAway');    // Número goles visitante
    const lastEvent    = document.getElementById('lastEvent');    // Texto del último evento
    const varBanner    = document.getElementById('varBanner');    // Banner naranja del VAR
    const matchCard    = document.getElementById('matchCard');    // Tarjeta del partido
    const logList      = document.getElementById('logList');      // Lista de eventos del log
    const connDot      = document.getElementById('connDot');      // Punto de color del indicador
    const connLabel    = document.getElementById('connLabel');    // Texto del indicador
    const btnReiniciar = document.getElementById('btnReiniciar'); // Botón reiniciar partido
    const btnHint      = document.getElementById('btnHint');      // Texto de ayuda del botón

    // ── Variables de estado del cliente ──────────────────────────────────────
    // 'ws' guarda la instancia activa del WebSocket. La declaramos aquí (fuera
    // de conectar()) para poder acceder a ella desde cualquier función si fuera
    // necesario cerrarla manualmente.
    let ws;

    // 'varActivo' rastrea si el VAR está en revisión en este momento.
    // Se usa para evitar cerrar el banner VAR ante eventos que no deberían cerrarlo.
    let varActivo = false;

    // ── Mapa de iconos por tipo de evento ─────────────────────────────────────
    // Cada tipo de evento del partido tiene un emoji asociado que se muestra
    // en el log de eventos. Usar un objeto como mapa es más limpio que un
    // switch/case y más fácil de extender si se agregan nuevos tipos de evento.
    const ICONOS = {
      KICKOFF:         '🏁',   // Inicio del partido
      GOAL:            '⚽',   // Gol anotado
      VAR_CHECK:       '📺',   // El VAR está revisando
      GOAL_ANNULLED:   '❌',   // El VAR anuló el gol
      MATCH_CONTINUES: '✅',   // El VAR confirmó el gol
      MATCH_END:       '🏆',   // Fin del partido
      default:         '🔔',   // Cualquier otro evento no listado
    };

    // =========================================================================
    // FUNCIÓN: actualizarMarcador(home, away, tipo)
    // =========================================================================
    // Actualiza los números del marcador en pantalla y aplica una animación
    // visual para que el usuario note el cambio (efecto "bump").
    //
    // Parámetros:
    //   home  → número de goles del equipo local
    //   away  → número de goles del equipo visitante
    //   tipo  → tipo de evento (para elegir el color de la animación)
    //
    // ¿Por qué la animación?
    // En un marcador en vivo, el usuario puede estar mirando otra parte de
    // la pantalla. La animación llama su atención sin necesitar una alerta.
    // =========================================================================
    function actualizarMarcador(home, away, tipo) {
      // Si el gol fue anulado usamos la clase 'bump-down' (color rojo/reducción)
      // para diferenciarlo visualmente de un gol normal (color azul/ampliación)
      const animClass = tipo === 'GOAL_ANNULLED' ? 'bump-down' : 'bump';

      // Actualizamos el texto de ambos marcadores con los nuevos valores
      scoreHome.textContent = home;
      scoreAway.textContent = away;

      // Aplicamos la clase CSS de animación a ambos números del marcador
      scoreHome.classList.add(animClass);
      scoreAway.classList.add(animClass);

      // Después de 400ms removemos la clase para que la animación pueda
      // volver a activarse en el próximo evento. Sin este setTimeout,
      // la clase quedaría pegada y la animación no se repetiría.
      setTimeout(() => {
        scoreHome.classList.remove('bump', 'bump-down');
        scoreAway.classList.remove('bump', 'bump-down');
      }, 400);
    }

    // =========================================================================
    // FUNCIÓN: actualizarVAR(tipo)
    // =========================================================================
    // Controla la visibilidad del banner naranja "VAR EN REVISIÓN" y el
    // borde naranja de la tarjeta del partido.
    //
    // ¿Por qué existe esta función separada?
    // Centralizar la lógica del VAR evita duplicar condiciones en otros lugares.
    // Si en el futuro cambia el comportamiento del VAR, solo se toca aquí.
    // =========================================================================
    function actualizarVAR(tipo) {
      if (tipo === 'VAR_CHECK') {
        // Cuando el VAR entra en acción: mostramos el banner y resaltamos la tarjeta
        varActivo = true;
        varBanner.classList.add('visible');    // Hace visible el banner (display: flex)
        matchCard.classList.add('var-active'); // Agrega el borde naranja a la tarjeta
      } else if (['GOAL_ANNULLED', 'MATCH_CONTINUES', 'GOAL'].includes(tipo)) {
        // Cuando el VAR toma una decisión (anula o confirma), ocultamos el banner.
        // También lo ocultamos si llega un GOAL porque eso cierra el episodio VAR.
        varActivo = false;
        varBanner.classList.remove('visible');    // Oculta el banner
        matchCard.classList.remove('var-active'); // Quita el borde naranja
      }
      // Para KICKOFF, FOUL, MATCH_END no hacemos nada con el VAR
    }

    // =========================================================================
    // FUNCIÓN: agregarLog(datos)
    // =========================================================================
    // Agrega una nueva fila al log de eventos en tiempo real que aparece
    // debajo de la tarjeta del partido.
    //
    // ¿Por qué insertar al inicio (insertBefore) y no al final (appendChild)?
    // El evento más reciente debe aparecer primero. Es más intuitivo para el
    // usuario ver el último evento en la parte de arriba del log.
    //
    // Parámetro:
    //   datos → objeto con los campos del evento (event_type, home, away, team...)
    // =========================================================================
    function agregarLog(datos) {
      const tipo  = datos.event_type || 'INFO';           // Tipo de evento o 'INFO' por defecto
      const icono = ICONOS[tipo] || ICONOS.default;       // Emoji del tipo de evento
      const hora  = new Date().toLocaleTimeString('es-CO', { hour12: false }); // Hora actual en formato HH:MM:SS

      // Generamos el texto descriptivo según el tipo de evento.
      // El operador || al final maneja cualquier evento no listado.
      const texto = {
        KICKOFF:         `Partido iniciado`,
        GOAL:            `¡GOL del equipo ${datos.team === 'home' ? 'local' : 'visitante'}! (${datos.home}-${datos.away})`,
        VAR_CHECK:       `VAR revisando el gol...`,
        GOAL_ANNULLED:   `Gol ANULADO por el VAR → (${datos.home}-${datos.away})`,
        MATCH_CONTINUES: `VAR confirma el gol ✔`,
        MATCH_END:       `Partido finalizado`,
      }[tipo] || `Evento: ${tipo}`;

      // Creamos el elemento <li> de la lista con la estructura de iconos y texto
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="log-icon">${icono}</span>
        <span class="log-time">${hora}</span>
        <span class="log-text">${texto}</span>
      `;

      // Insertamos el nuevo elemento AL INICIO de la lista (antes del primero)
      // para que el evento más reciente siempre aparezca en la parte de arriba
      logList.insertBefore(li, logList.firstChild);

      // Limitamos el log a 20 entradas para evitar que la lista crezca
      // indefinidamente y afecte el rendimiento del navegador
      while (logList.children.length > 20) {
        logList.removeChild(logList.lastChild); // Eliminamos la entrada más antigua
      }
    }

    // =========================================================================
    // FUNCIÓN: procesarMensaje(datos)
    // =========================================================================
    // Es la función central del dashboard. Se llama cada vez que llega un
    // mensaje por WebSocket desde el dashboard_backend, y coordina la
    // actualización de TODOS los elementos visuales de la página.
    //
    // ¿De dónde vienen los datos?
    // El flujo completo es:
    //   live_feed_producer → Kafka → match_state_service → RabbitMQ
    //   → dashboard_backend → WebSocket → ws.onmessage → procesarMensaje()
    //
    // Parámetro:
    //   datos → objeto JSON con: { event_type, home, away, match_id, team, ... }
    // =========================================================================
    function procesarMensaje(datos) {
      const tipo = datos.event_type; // Extraemos el tipo de evento para usarlo en todas las decisiones

      // Paso 1: Actualizar el marcador SOLO si el mensaje incluye puntuaciones.
      // No todos los eventos cambian el marcador (ej: FOUL no tiene home/away).
      // typeof number asegura que 0 también se detecte (0 es falsy en JS).
      if (typeof datos.home === 'number' && typeof datos.away === 'number') {
        actualizarMarcador(datos.home, datos.away, tipo);
      }

      // Paso 2: Manejar el estado visual del VAR (banner naranja y borde)
      actualizarVAR(tipo);

      // Paso 3: Actualizar la línea de "último evento" debajo del marcador.
      // Cada tipo de evento tiene su propio mensaje amigable para el usuario.
      const mensajes = {
        KICKOFF:         '🏁 ¡Partido iniciado!',
        GOAL:            `⚽ ¡GOL del equipo ${datos.team === 'home' ? 'local' : 'visitante'}!`,
        VAR_CHECK:       '📺 VAR revisando la jugada...',
        GOAL_ANNULLED:   '❌ ¡Gol anulado por el VAR!',
        MATCH_CONTINUES: '✅ El VAR confirma el gol',
        MATCH_END:       '🏆 Partido finalizado',
      };
      // Actualizamos el texto; si el tipo no está en el mapa, mostramos el tipo crudo
      lastEvent.textContent = mensajes[tipo] || `Evento: ${tipo}`;

      // Reseteamos las clases de color del texto (goal=azul, annul=rojo, var=naranja)
      // y aplicamos la que corresponde al tipo de evento actual
      lastEvent.className = 'last-event';
      if (tipo === 'GOAL')          lastEvent.classList.add('goal');  // Azul para goles
      if (tipo === 'GOAL_ANNULLED') lastEvent.classList.add('annul'); // Rojo para anulaciones
      if (tipo === 'VAR_CHECK')     lastEvent.classList.add('var');   // Naranja para VAR

      // Paso 4: Agregar el evento al log cronológico que el usuario puede revisar
      agregarLog(datos);

      // Paso 5: Actualizar el indicador de estado del partido (esquina superior derecha)
      // y el estado habilitado/deshabilitado del botón "Reiniciar Partido"
      if (tipo === 'MATCH_END') {
        // El partido terminó: indicador rojo y habilitamos el botón para reiniciar
        setEstadoConexion('finished');
        setBotonHabilitado(true);  // El usuario ya puede presionar "Reiniciar Partido"
      } else {
        // El partido está en curso: indicador verde
        setEstadoConexion('live');
        if (tipo === 'KICKOFF') {
          // Al inicio de un nuevo partido deshabilitamos el botón: no tiene sentido
          // reiniciar un partido que acaba de comenzar
          setBotonHabilitado(false);
        }
      }
    }

    // =========================================================================
    // FUNCIÓN: conectar()
    // =========================================================================
    // Establece la conexión WebSocket con el dashboard_backend y configura
    // todos los manejadores de eventos (onopen, onmessage, onclose, onerror).
    //
    // ¿Por qué reconexión automática?
    // En sistemas distribuidos las conexiones de red pueden caerse en cualquier
    // momento (reinicio del servidor, corte de red, etc.). La reconexión automática
    // garantiza que el dashboard vuelva a funcionar sin que el usuario tenga que
    // recargar la página manualmente.
    // =========================================================================
    function conectar() {
      // Indicamos visualmente que estamos intentando conectar (punto naranja pulsante)
      setEstadoConexion('connecting');

      // Creamos la conexión WebSocket apuntando al mismo servidor que sirvió el HTML
      ws = new WebSocket(WS_URL);

      // ── Evento: conexión establecida con éxito ────────────────────────────
      ws.onopen = () => {
        // Mientras no llegue el primer evento del partido, mostramos "Conectando..."
        // porque no sabemos aún si hay un partido en curso o esperando
        setEstadoConexion('connecting');
        console.log('[WS] Conectado al dashboard_backend');
      };

      // ── Evento: llegó un mensaje del dashboard_backend ────────────────────
      ws.onmessage = (evento) => {
        // 'evento.data' es el string JSON que envió el servidor
        try {
          const datos = JSON.parse(evento.data); // Convertimos el string a objeto JS
          console.log('[WS] Mensaje recibido:', datos);
          procesarMensaje(datos); // Delegamos el procesamiento a la función principal
        } catch (e) {
          // Si el JSON está malformado (problema en el servidor), lo registramos
          // pero NO rompemos la conexión: el siguiente mensaje puede ser válido
          console.error('[WS] Error parseando mensaje:', e);
        }
      };

      // ── Evento: conexión cerrada (servidor caído, red cortada, etc.) ──────
      ws.onclose = () => {
        // Actualizamos el indicador a gris "Sin conexión"
        setEstadoConexion('disconnected');
        console.warn('[WS] Conexion cerrada. Reintentando en 3s...');
        // Intentamos reconectar después de 3 segundos.
        // Usamos setTimeout (no setInterval) para que cada intento
        // sea un ciclo completo de conectar(), evitando conexiones duplicadas.
        setTimeout(conectar, 3000);
      };

      // ── Evento: error en la conexión WebSocket ────────────────────────────
      ws.onerror = (e) => {
        // El error generalmente va seguido de un onclose, así que la reconexión
        // ya está manejada allí. Aquí solo registramos para debugging.
        console.error('[WS] Error:', e);
      };
    }

    // =========================================================================
    // FUNCIÓN: setEstadoConexion(estado)
    // =========================================================================
    // Actualiza el indicador visual de estado en la esquina superior derecha
    // de la pantalla. Cambia el color del punto y el texto según el estado.
    //
    // Estados posibles:
    //   connecting   → 🟠 Naranja pulsante: conectando o esperando primer evento
    //   restarting   → 🟠 Naranja pulsante: reiniciando el partido
    //   live         → 🟢 Verde: partido en curso con eventos llegando
    //   finished     → 🔴 Rojo: el partido terminó (MATCH_END recibido)
    //   disconnected → ⚫ Gris: sin conexión WebSocket con el servidor
    // =========================================================================
    function setEstadoConexion(estado) {
      // La clase CSS determina el color y animación del punto indicador
      // (definidos en el bloque <style> de este mismo archivo)
      connDot.className = `conn-dot ${estado}`;

      // Mapeamos cada estado a su etiqueta de texto visible al usuario
      connLabel.textContent = {
        connecting:    'Conectando...',   // Esperando primera conexión o primer evento
        restarting:    'Reiniciando...',  // Se envió la señal de reinicio al backend
        live:          'En vivo',         // Partido activo, eventos llegando
        finished:      'Finalizado',      // MATCH_END recibido, partido terminó
        disconnected:  'Sin conexión',    // WebSocket cerrado, intentando reconectar
      }[estado] || estado; // Si el estado no está en el mapa, mostramos el estado crudo
    }

    // =========================================================================
    // FUNCIÓN: setBotonHabilitado(habilitado)
    // =========================================================================
    // Controla si el botón "Reiniciar Partido" está activo (clickeable) o
    // deshabilitado (gris, no responde al click).
    //
    // ¿Por qué deshabilitar el botón durante el partido?
    // No tiene sentido reiniciar un partido que ya está corriendo. Si el usuario
    // pudiera presionar el botón en cualquier momento, podría interrumpir el
    // partido a mitad y causar inconsistencias en el estado del sistema.
    //
    // Reglas:
    //   MATCH_END → habilitado = true  (el partido terminó, se puede reiniciar)
    //   KICKOFF   → habilitado = false (nuevo partido empezó, no interrumpir)
    //
    // Parámetro:
    //   habilitado → true para activar el botón, false para desactivarlo
    // =========================================================================
    function setBotonHabilitado(habilitado) {
      // La propiedad 'disabled' del elemento <button> controla si responde a clicks.
      // true = deshabilitado (gris, no clickeable) / false = habilitado (activo)
      btnReiniciar.disabled = !habilitado;

      // El texto de ayuda ("Disponible cuando finalice el partido") se oculta
      // cuando el botón está activo y aparece cuando está deshabilitado,
      // para guiar al usuario sobre cuándo puede usar el botón.
      btnHint.style.visibility = habilitado ? 'hidden' : 'visible';
    }

    // =========================================================================
    // FUNCIÓN ASYNC: reiniciarPartido()
    // =========================================================================
    // Se ejecuta cuando el usuario presiona el botón "Reiniciar Partido".
    // Realiza la limpieza visual del dashboard Y envía la señal de reinicio
    // al dashboard_backend, que a su vez la reenvía al live_feed_producer
    // a través de la cola RabbitMQ "restart_commands".
    //
    // Es async porque necesita esperar la respuesta del servidor (await fetch)
    // antes de actualizar el indicador final.
    //
    // Flujo que desencadena esta función:
    //   1. Click del usuario
    //   2. Limpieza visual inmediata (UX responsiva)
    //   3. POST /reiniciar → dashboard_backend → RabbitMQ → live_feed_producer
    //   4. El producer publica KICKOFF → Kafka → match_state_service → RabbitMQ
    //   5. dashboard_backend recibe por RabbitMQ y hace broadcast WebSocket
    //   6. procesarMensaje() recibe el KICKOFF y actualiza la pantalla
    // =========================================================================
    async function reiniciarPartido() {
      // Paso 1: Cambiar el indicador a naranja "Reiniciando..." y deshabilitar
      // el botón INMEDIATAMENTE para evitar que el usuario lo presione dos veces
      // mientras se procesa la solicitud (doble click = dos partidos simultáneos)
      setEstadoConexion('restarting');
      setBotonHabilitado(false);

      // Paso 2: Actualizar el marcador a 0-0 de forma inmediata para dar
      // feedback visual instantáneo al usuario, sin esperar la respuesta del servidor
      scoreHome.textContent = '0';
      scoreAway.textContent = '0';

      // Paso 3: Limpiar el log de eventos del partido anterior
      // y agregar una entrada que indica que se está reiniciando
      logList.innerHTML = ''; // Vaciamos completamente el log
      const li = document.createElement('li'); // Creamos el elemento de lista
      li.innerHTML = `
        <span class="log-icon">🔄</span>
        <span class="log-time">${new Date().toLocaleTimeString('es-CO', { hour12: false })}</span>
        <span class="log-text">Reiniciando partido...</span>
      `;
      logList.insertBefore(li, logList.firstChild); // Lo ponemos al inicio del log

      // Paso 4: Restablecer todos los elementos visuales al estado inicial
      lastEvent.textContent = 'Esperando inicio del partido...'; // Texto neutro
      lastEvent.className = 'last-event';            // Sin clases de color (goal/annul/var)
      varBanner.classList.remove('visible');          // Ocultamos el banner del VAR
      matchCard.classList.remove('var-active');       // Quitamos el borde naranja de la tarjeta

      // Paso 5: Llamar al endpoint del backend que publica el mensaje RESTART
      // a la cola RabbitMQ "restart_commands", que el live_feed_producer escucha
      try {
        // fetch() hace una petición HTTP POST al mismo servidor que sirve esta página
        const resp = await fetch('/reiniciar', { method: 'POST' });
        const data = await resp.json(); // Parseamos la respuesta { ok: true }

        // Si el backend confirmó el reinicio, pasamos el indicador a verde "En vivo"
        // porque el live_feed_producer ya está corriendo el nuevo partido
        if (data.ok) setEstadoConexion('live');
      } catch (e) {
        // Si el servidor no responde (caído, red cortada), mostramos gris "Sin conexión"
        console.error('[RESET] Error al llamar /reiniciar:', e);
        setEstadoConexion('disconnected');
      }
    }

    // =========================================================================
    // ARRANQUE DEL CLIENTE
    // =========================================================================
    // Esta es la última línea del script: inicia la conexión WebSocket.
    // Todo lo demás son definiciones de funciones que se ejecutarán cuando
    // lleguen eventos del WebSocket o el usuario interactúe con la página.
    // =========================================================================
    conectar(); // Inicia la conexión WebSocket con el dashboard_backend
  </script>
</body>
</html>
